name: Deploy to Staging

# Frontend is deployed by Vercel's native Git integration (auto-deploy on push) —
# no separate frontend job needed here.

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend (Go → Render)
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build (pre-check)
        working-directory: backend
        run: go build -o bin/server ./cmd/main.go

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
